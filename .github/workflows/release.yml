name: Release

# Baut das Docker-Image und veröffentlicht es in ghcr.io unter der Version YYYY-MM-DD_hhmmss (UTC) und als latest.
on:
  push:
    branches: [main]
    paths: [src/**, pyproject.toml, Dockerfile, .dockerignore, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Releases nacheinander, damit latest immer zum jüngsten Stand gehört
concurrency: release

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Version und Imagename
        run: |
          echo "VERSION=$(date -u +%Y-%m-%d_%H%M%S)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"  # ghcr verlangt Kleinbuchstaben

      # Ohne Layer-Cache: jeder Release holt das aktuelle yt-dlp (README, "yt-dlp aktuell halten")
      - name: Bauen
        run: |
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .

      - name: Veröffentlichen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          echo "Veröffentlicht: \`$IMAGE:$VERSION\` (auch als \`latest\`)" >> "$GITHUB_STEP_SUMMARY"
